# Docker alternative to scripts/start-idp.mjs: same server, same version, same config.
# `docker compose up -d idp`, then `npm start` / `npm run test:e2e` reuse it on :9000.
services:
  idp:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3
    ports:
      - "9000:9000"
    environment:
      SERVER_PORT: "9000"
      JSON_CONFIG_PATH: /config/mock-oauth2-config.json
    volumes:
      - ./idp/mock-oauth2-config.json:/config/mock-oauth2-config.json:ro
