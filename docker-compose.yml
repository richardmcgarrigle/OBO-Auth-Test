# The local IdP. npm start and the e2e tests start and stop it for you (scripts/idp.mjs);
# by hand: `npm run idp:up` / `npm run idp:down`, or `docker compose up -d idp` / `docker compose down`.
name: obo-poc
services:
  idp:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3
    ports:
      - "127.0.0.1:${IDP_PORT:-9000}:8080"  # localhost only
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/mock-oauth2-config.json
    volumes:
      - ./idp/mock-oauth2-config.json:/config/mock-oauth2-config.json:ro
